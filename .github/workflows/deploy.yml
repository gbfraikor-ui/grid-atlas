# Publish site/ to GitHub Pages on every push to main.
# No building happens here: the data files in site/ are committed by the pipeline.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:  # also adds a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write     # publish to Pages
  id-token: write  # prove to Pages that this workflow is allowed to

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
